# ----------------------------------------------------- 
# Monitor Setup
# name: "Default"
# ----------------------------------------------------- 

# built-in
monitor=eDP-1,highres,0x0,2

# 1920x1080


# HDMI slot monitor
monitor=HDMI-A-1,highres@highrr,0x-2160,1

# extra monitors on dock
monitor=DP-5,highres,1920x-2400,1,transform,2 # Samsung
monitor=DP-7,highres,-1080x-2600,1,transform,3 # Acer
monitor=DP-6,highres,0x-2400,1 # Amazon


xwayland {
    force_zero_scaling = true
}
