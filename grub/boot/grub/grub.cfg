menuentry "Arch" --class arch --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-297ae7d2-d110-4f21-ba4d-ba3820d83119' {
	load_video
	set gfxpayload=keep
	insmod gzio
	insmod part_gpt
	insmod fat
	search --no-floppy --fs-uuid --set=root D148-A670
	echo	'Loading Linux linux ...'
	linux	/vmlinuz-linux root=UUID=297ae7d2-d110-4f21-ba4d-ba3820d83119 rw  loglevel=3 quiet
	echo	'Loading initial ramdisk ...'
	initrd	/intel-ucode.img /initramfs-linux.img
}
